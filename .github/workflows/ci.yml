name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # common/ (portfolio-common must be public, same owner)
      - run: cp .env.example .env
      - name: Migrations follow the lock rules
        run: sh common/scripts/check-migrations.sh
      - name: Tests against real Postgres (claims, retries, leases, fencing, graceful shutdown)
        run: docker compose -f compose.yaml run --rm test
      - name: Stack with 3 api replicas + smoke test
        run: sh common/scripts/ci-stack.sh 3
      - name: Stack with 3 workers, each takes jobs
        run: |
          docker compose -f compose.yaml up -d --wait --build --scale worker=3
          sh infra/worker-smoke.sh 3
      - name: Enqueue to handled under 50 ms (p95, idle queue)
        run: docker compose -f compose.yaml --profile loadtest run --rm k6 run --quiet /scripts/latency.js
      - name: "Scheduler failover: SIGKILL the leader, standby takes over within 5 s, no run skipped or duplicated"
        run: sh infra/scheduler-failover.sh
      - name: "Chaos test: 10,000 jobs while every worker is SIGKILLed at random"
        run: sh infra/chaos-test.sh 4
      - name: Logs
        if: failure()
        run: docker compose -f compose.yaml logs --tail=200
      - name: Teardown
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV" # GHCR needs lowercase
      # ponytail: QEMU for arm64. Switch to native arm64 runners + manifest merge if builds get slow.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
