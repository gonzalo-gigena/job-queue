<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job queue</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; --line: #8884; --muted: #888; }
    body { margin: 0 auto; padding: 1rem 1.5rem 3rem; max-width: 80rem; }
    header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    h1 { font-size: 1.3rem; margin: 0.5rem 0; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    #live { color: var(--muted); font-size: 0.9em; }
    #live.on::before { content: "● "; color: #2a2; }
    #live.off::before { content: "● "; color: #c33; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 0.85em; }
    td.n, th.n { text-align: right; }
    .err { color: #c33; max-width: 28rem; overflow-wrap: anywhere; font-size: 0.9em; }
    .badge { padding: 0.05rem 0.45rem; border-radius: 1rem; font-size: 0.85em; background: #8882; }
    .s-running { background: #36f3; } .s-succeeded { background: #2a23; } .s-dead { background: #c333; }
    .s-queued { background: #fa03; } .s-cancelled { background: #8883; }
    button { font: inherit; padding: 0.15rem 0.6rem; cursor: pointer; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    input, select { font: inherit; padding: 0.15rem 0.3rem; }
    a { cursor: pointer; }
    dialog { max-width: 50rem; width: 90vw; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #8881; padding: 0.75rem; }
    .demo { margin-left: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Job queue</h1>
    <span id="live" class="off">connecting…</span>
    <span class="demo">Demo:
      <button data-demo="ok">+20 jobs</button>
      <button data-demo="fail">+5 failing</button>
    </span>
  </header>

  <h2>Queues</h2>
  <table>
    <thead><tr>
      <th>queue</th><th class="n">ready</th><th class="n">scheduled</th><th class="n">running</th><th class="n">dead</th>
      <th class="n">done/min</th><th class="n">failure rate 5 min</th><th class="n">oldest ready</th><th>limits</th><th></th>
    </tr></thead>
    <tbody id="queues"></tbody>
  </table>

  <h2>Jobs</h2>
  <form id="filters">
    <select name="status">
      <option value="">any status</option>
      <option>queued</option><option>running</option><option>succeeded</option>
      <option>dead</option><option>cancelled</option>
    </select>
    <input name="queue" placeholder="queue" size="12">
    <input name="kind" placeholder="kind" size="16">
    <span id="msg" class="err"></span>
  </form>
  <table>
    <thead><tr>
      <th class="n">id</th><th>queue</th><th>kind</th><th>status</th><th class="n">attempt</th>
      <th class="n">age</th><th>last error</th><th></th>
    </tr></thead>
    <tbody id="jobs"></tbody>
  </table>

  <dialog id="detail"><form method="dialog"><button>close</button></form><pre id="detail-body"></pre></dialog>

  <script>
    // Everything here comes from /api/admin/*, behind ADMIN_TOKEN as an HTTP basic auth password.
    // The browser prompts on the first 401 and sends it with every later request.
    const $ = (id) => document.getElementById(id);
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
    const age = (t) => { const s = Math.max(0, (Date.now() - new Date(t)) / 1000); return s < 60 ? s.toFixed(0) + ' s' : s < 3600 ? (s / 60).toFixed(0) + ' min' : (s / 3600).toFixed(1) + ' h'; };
    const dur = (s) => s == null ? '–' : s < 60 ? s.toFixed(1) + ' s' : (s / 60).toFixed(1) + ' min';

    async function api(method, path, body) {
      const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText);
      return data;
    }
    const act = (method, path, body) => api(method, path, body).then(() => { $('msg').textContent = ''; }, (e) => { $('msg').textContent = e.message; });
    const button = (label, onclick) => { const b = el('button', label); b.onclick = onclick; return b; };

    function renderQueues(qs) {
      $('queues').replaceChildren(...qs.map((q) => {
        const tr = el('tr');
        const lim = q.limits ? [q.limits.max_running && `≤${q.limits.max_running} running`, q.limits.rate_per_sec && `${q.limits.rate_per_sec}/s`].filter(Boolean).join(', ') : '';
        tr.append(el('td', q.queue), el('td', q.ready, 'n'), el('td', q.scheduled, 'n'), el('td', q.running, 'n'), el('td', q.dead, 'n'),
          el('td', q.done_per_min, 'n'), el('td', q.failure_rate_5m == null ? '–' : (q.failure_rate_5m * 100).toFixed(1) + ' %', 'n'),
          el('td', dur(q.oldest_ready_age_s), 'n'), el('td', (q.paused ? 'paused ' : '') + lim));
        const td = el('td');
        td.append(q.paused ? button('resume', () => act('POST', `/api/admin/queues/${q.queue}/resume`))
                           : button('pause', () => act('POST', `/api/admin/queues/${q.queue}/pause`)));
        tr.append(td);
        return tr;
      }));
    }

    function renderJobs(js) {
      $('jobs').replaceChildren(...js.map((j) => {
        const tr = el('tr');
        const id = el('td', null, 'n'); const a = el('a', j.id); a.onclick = () => showJob(j.id); id.append(a);
        const st = el('td'); st.append(el('span', j.status, 'badge s-' + j.status));
        const actions = el('td');
        if (j.status === 'dead') actions.append(button('retry', () => act('POST', `/api/admin/jobs/${j.id}/retry`)), ' ', button('discard', () => act('POST', `/api/admin/jobs/${j.id}/discard`)));
        if (j.status === 'queued' || j.status === 'running') actions.append(button('cancel', () => act('POST', `/api/admin/jobs/${j.id}/cancel`)));
        tr.append(id, el('td', j.queue), el('td', j.kind), st, el('td', `${j.attempts}/${j.max_attempts}`, 'n'), el('td', age(j.created_at), 'n'),
          el('td', j.last_error ?? '', 'err'), actions);
        return tr;
      }));
    }

    async function showJob(id) {
      try { $('detail-body').textContent = JSON.stringify(await api('GET', `/api/admin/jobs/${id}`), null, 2); }
      catch (e) { $('detail-body').textContent = e.message; }
      $('detail').showModal();
    }

    let stream;
    function connect() {
      stream?.close();
      const params = new URLSearchParams([...new FormData($('filters'))].filter(([, v]) => v));
      stream = new EventSource('/api/admin/stream?' + params);
      stream.onopen = () => { $('live').className = 'on'; $('live').textContent = 'live'; };
      stream.onerror = () => { $('live').className = 'off'; $('live').textContent = 'reconnecting…'; };
      stream.onmessage = (e) => { const d = JSON.parse(e.data); renderQueues(d.queues); renderJobs(d.jobs); };
    }
    let debounce;
    $('filters').oninput = () => { clearTimeout(debounce); debounce = setTimeout(connect, 300); };
    $('filters').onsubmit = (e) => e.preventDefault();

    document.querySelectorAll('[data-demo]').forEach((b) => b.onclick = async () => {
      const fail = b.dataset.demo === 'fail';
      for (let i = 0; i < (fail ? 5 : 20); i++) {
        await act('POST', '/api/jobs', fail ? { kind: 'effect', payload: { fail: true }, max_attempts: 3 } : { kind: 'sleep', payload: { ms: 300 + Math.floor(Math.random() * 1500) } });
      }
    });

    // A plain fetch first, so the browser shows its login prompt before the EventSource opens.
    api('GET', '/api/admin/queues').then(renderQueues, (e) => { $('msg').textContent = e.message; }).finally(connect);
  </script>
</body>
</html>
