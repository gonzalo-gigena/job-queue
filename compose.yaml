# Base stack: prod-like. Dev: `docker compose up --watch` (also loads compose.override.yaml if present).
# Shared pieces come from the `common` submodule (portfolio-common).
include:
  - path: common/observability/compose.yaml
    env_file: .env
x-db-url: &db-url postgres://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}?sslmode=disable
# Pools go through PgBouncer (transaction mode). Session state (LISTEN, the scheduler's advisory lock)
# can't, so those use DIRECT_DATABASE_URL.
x-pooled-url: &pooled-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?sslmode=disable

services:
  caddy:
    image: caddy:2.11-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./common/caddy:/common/caddy:ro
      - ./apps/web:/srv:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  # Scalable: no container_name, no host ports. `docker compose up --scale api=3`.
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: *pooled-url
      DIRECT_DATABASE_URL: *db-url
      ADMIN_TOKEN: ${ADMIN_TOKEN:?copy .env.example to .env}
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  # Same image as api, run as `api worker`. Scale with `--scale worker=N`.
  worker:
    build: ./apps/api
    command: ["worker"]
    environment:
      DATABASE_URL: *pooled-url
      DIRECT_DATABASE_URL: *db-url
      WORKER_QUEUES: default
    init: true
    stop_grace_period: 35s # a last claim (5 s) + drain (25 s) + release (4 s), see worker.go
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    restart: unless-stopped

  # Same image, run as `api scheduler`: every replica reaps expired leases, the leader also runs cron.
  # Two replicas so a standby takes over when the leader dies (infra/scheduler-failover.sh).
  scheduler:
    build: ./apps/api
    command: ["scheduler"]
    scale: 2
    environment:
      DATABASE_URL: *pooled-url
      DIRECT_DATABASE_URL: *db-url
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 64m
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql  # 18+ keeps data in a versioned subdir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  # Transaction pooling: many worker connections share a few server connections. 1.21+ tracks
  # protocol-level prepared statements, so pgx's statement cache works through it.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_PREPARED_STATEMENTS: 200
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 2000
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./infra/db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", *db-url, "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # docker compose run --rm seed
  seed:
    image: postgres:18.6-alpine
    profiles: [tools]
    volumes:
      - ./infra/db/seed.sql:/seed.sql:ro
    command: ["psql", *db-url, "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Go tests, integration ones included, against the real db: docker compose run --rm test
  test:
    image: golang:1.27.4-bookworm
    profiles: [tools]
    working_dir: /src
    volumes:
      - ./apps/api:/src
    environment:
      DATABASE_URL: *db-url
    command: ["sh", "-c", "go vet ./... && go test -race -count=1 -v ./..."]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # sh common/scripts/scale.sh, or: docker compose --profile loadtest run --rm k6 run /scripts/main.js
  k6:
    image: grafana/k6:2.4.0
    profiles: [loadtest]
    volumes:
      - ./infra/loadtest:/scripts:ro
    environment:
      BASE_URL: http://caddy:8080

volumes:
  pgdata:
  caddy_data:
